# Publishes the browser demo (site/ + the app's sounds) to GitHub Pages.
# One-time setup: repo Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Demo site

on:
  push:
    branches: [main]
    paths: ["site/**", "Resources/Packs/**", "Resources/Mouse/**", "docs/logo.png", "scripts/build_site.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v4
